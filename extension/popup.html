<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 320px; background: #060807; color: #d8e6dc; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .top { padding: 10px 12px; border-bottom: 1px solid #1d2a22; color: #8cff5a; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  .top img { width: 18px; height: 18px; image-rendering: pixelated; }
  .pb { padding: 10px 12px; }
  input { box-sizing: border-box; width: 100%; background: #0c110e; color: #d8e6dc; border: 1px solid #1d2a22; padding: 8px; font: inherit; border-radius: 4px; outline: none; }
  input:focus { border-color: #8cff5a; }
  button { margin-top: 8px; width: 100%; background: #8cff5a; color: #060807; border: 0; padding: 8px; font: inherit; font-weight: 600; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #out { margin-top: 12px; }
</style>
</head>
<body>
  <div class="top"><img src="icons/32.png" alt="">RAT KING CHECK</div>
  <div class="pb">
    <input id="ca" placeholder="paste any Solana token address" spellcheck="false" autocomplete="off">
    <button id="go">Check</button>
    <div id="out"></div>
  </div>
  <script src="render.js"></script>
  <script src="popup.js"></script>
</body>
</html>
